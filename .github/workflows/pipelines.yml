name: Pipeline tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipelines-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gold-orders:
    name: gold orders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r pipelines/requirements-dev.txt

      - name: Test collapse rules and the sample fixture
        run: python3 -m pytest pipelines/tests -q

      - name: Transform the sample into gold
        run: python3 -m pipelines.orders transform --input data/samples/order_events.ndjson --output pipelines/out/gold_orders.ndjson

      - name: Assert the gold file
        run: python3 -m pipelines.orders check --output pipelines/out/gold_orders.ndjson
