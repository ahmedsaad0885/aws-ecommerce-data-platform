name: Pipeline tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pipelines/**"
      - "data/**"
      - "services/**"
      - ".github/workflows/pipelines.yml"

permissions:
  contents: read

jobs:
  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Future pipeline tests
        run: |
          echo "Pipeline tests are not implemented yet."
          echo "Next check to add: transform data/samples into the gold column contract and assert the result locally."
          python3 scripts/check_repo.py
          python3 -m compileall -q services
