# Land beefy e-commerce NDJSON into the dev lake raw prefixes.
# Pull requests generate the small test scale and print the keys and sizes.
# That job does not call AWS. Upload is workflow_dispatch on main after typing
# land-dev-raw. Merging this workflow does not upload.
name: Land dev raw data

on:
  pull_request:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type land-dev-raw to upload the beefy raw files into the dev lake. Any other value only prints a small dry-run."
        required: true
        default: plan
        type: string

permissions:
  contents: read

concurrency:
  group: land-dev-raw-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: dry-run dev raw landing
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'land-dev-raw')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Print the keys and sizes for the test scale
        run: python3 scripts/land_dev_raw.py plan --scale test --seed 42

  reject-off-main:
    name: refuse upload off main
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'land-dev-raw' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "Refusing to upload from ${{ github.ref }}."
          echo "Run Land dev raw data from the main branch and type land-dev-raw."
          exit 1

  upload:
    name: upload dev raw landing
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'land-dev-raw' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: land-dev-raw-upload
      cancel-in-progress: false
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must both be set."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          allowed-account-ids: "737334244495"
          force-skip-oidc: "true"
          disable-retry: "true"
          output-credentials: "false"

      - name: Generate the beefy e-commerce dataset
        run: python3 -m pipelines.datasets ecom --scale beefy --seed 42 --output data/generated/ecom

      - name: Upload the three raw objects
        env:
          LAND_DEV_RAW_CONFIRM: land-dev-raw
        run: python3 scripts/land_dev_raw.py upload --input data/generated/ecom
