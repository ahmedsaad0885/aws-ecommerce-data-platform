# Land mega airport NDJSON into the dev lake.
# This workflow does not run on a pull request. Upload is workflow_dispatch
# on main after typing land-dev-airports. Merging this file does not upload.
# It does not run Terraform and it does not create IAM.
name: Dev airports land

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type land-dev-airports to upload. Any other value uploads nothing."
        required: true
        default: plan
        type: string
      start_date:
        description: "First operating day, YYYY-MM-DD. Must stay inside 2026-04-01 through 2026-05-30."
        required: true
        default: "2026-04-01"
        type: string
      days:
        description: "How many days to land, from 1 to 60. Default is a 2-day test. This is not the generator horizon."
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: land-dev-airports-upload
  cancel-in-progress: false

jobs:
  explain:
    name: confirm was not land-dev-airports
    if: github.event.inputs.confirm != 'land-dev-airports'
    runs-on: ubuntu-latest
    steps:
      - name: Upload nothing
        run: |
          echo "Confirm was '${{ github.event.inputs.confirm }}'."
          echo "Nothing was uploaded. Type land-dev-airports on the main branch to land files."

  reject-off-main:
    name: refuse upload off main
    if: github.event.inputs.confirm == 'land-dev-airports' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "Refusing to upload from ${{ github.ref }}."
          echo "Run Dev airports land from the main branch and type land-dev-airports."
          exit 1

  reference:
    name: land reference tables
    if: github.event.inputs.confirm == 'land-dev-airports' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      dates: ${{ steps.dates.outputs.dates }}
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LAND_DEV_AIRPORTS_CONFIRM: land-dev-airports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must both be set."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          allowed-account-ids: "737334244495"
          force-skip-oidc: "true"
          disable-retry: "true"
          output-credentials: "false"

      - name: Compute the day list
        id: dates
        run: |
          python3 scripts/land_dev_airports.py dates \
            --start "${{ github.event.inputs.start_date }}" \
            --days "${{ github.event.inputs.days }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate the reference tables once
        run: |
          python3 -m pipelines.datasets airports \
            --scale mega \
            --seed 42 \
            --reference-only \
            --output "$RUNNER_TEMP/airports-reference"

      - name: Upload the reference prefixes
        run: |
          python3 scripts/land_dev_airports.py upload-reference \
            --input "$RUNNER_TEMP/airports-reference" \
            --record "$RUNNER_TEMP/reference.json"

      - name: Save the reference record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airport-land-reference
          path: ${{ runner.temp }}/reference.json

  days:
    name: land ${{ matrix.date }}
    needs: reference
    if: github.event.inputs.confirm == 'land-dev-airports' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        date: ${{ fromJson(needs.reference.outputs.dates) }}
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      LAND_DEV_AIRPORTS_CONFIRM: land-dev-airports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must both be set."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          allowed-account-ids: "737334244495"
          force-skip-oidc: "true"
          disable-retry: "true"
          output-credentials: "false"

      - name: Generate one mega day
        run: |
          python3 -m pipelines.datasets airports \
            --scale mega \
            --seed 42 \
            --date "${{ matrix.date }}" \
            --skip-reference \
            --output "$RUNNER_TEMP/airports-day"

      - name: Upload that day and check object sizes
        run: |
          python3 scripts/land_dev_airports.py upload-day \
            --input "$RUNNER_TEMP/airports-day" \
            --date "${{ matrix.date }}" \
            --record "$RUNNER_TEMP/day.json"

      - name: Save the day record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: airport-land-${{ matrix.date }}
          path: ${{ runner.temp }}/day.json

  summary:
    name: landing summary
    needs: [reference, days]
    if: github.event.inputs.confirm == 'land-dev-airports' && github.ref == 'refs/heads/main' && needs.reference.result == 'success' && needs.days.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the per-job records
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: airport-land-*
          path: landing-records

      - name: Print total rows, bytes, and objects
        run: python3 scripts/land_dev_airports.py summarize --input landing-records
